# MineWorldCraft's shared world: a Worker in front of one Durable Object (src/index.js).
name = "mineworldcraft-mp"
main = "src/index.js"
compatibility_date = "2025-10-01"

# Its addresses: mineworldcraft.fun (and www), a domain on this Cloudflare account, and the workers.dev address.
workers_dev = true
routes = [
  { pattern = "mineworldcraft.fun", custom_domain = true },
  { pattern = "www.mineworldcraft.fun", custom_domain = true },
]

[[durable_objects.bindings]]
name = "WORLD"
class_name = "World"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["World"]

# The website (web/ as it is: no build) is served by this same Worker, so the game and its world server share one
# address: a request for a file in web/ is answered from the static assets (free, and not counted against the
# Worker's daily requests); anything else (/ws, /count) reaches the Worker. web/.assetsignore keeps local dev files
# (chain.json) off the site.
[assets]
directory = "../web"

# The chain, once the contracts are deployed. Until MINING_ADDRESS is set the room runs the world on a practice ledger
# (players see what they'd earn; it's reset at launch and never paid), and trips and the shop are free. The voucher key is a secret: `npx wrangler secret put MINING_KEY` (its address is MiningSites'
# signer). Locally, ./dev.sh writes all of these to .dev.vars.
[vars]
# CHAIN_ID = "4663"
# CHAIN_RPC = "https://robinhood-rpc.publicnode.com"
# MINING_ADDRESS = "0x..."
# CRAFTERS_ADDRESS = "0x..."  (MineWorld Crafters: a player wears one only once the room has checked they own it)
# LEVELS_ADDRESS = "0x..."    (CrafterLevels: each Crafter's level, for its boost; without it every Crafter is level 1)
# PAYMENTS_ADDRESS = "0x..."  (MinePayments: rocket tickets are paid there; without it none can be bought)
# Later NFT collections that boost mining (web/boosts.js SLOTS), once issued, if their address isn't in boosts.js:
# SKINS_ADDRESS, COMPANIONS_ADDRESS, AURAS_ADDRESS, VEHICLES_ADDRESS.
# Never set DEV_HOOKS here: it's for `wrangler dev --var DEV_HOOKS:1` on your own machine only.
